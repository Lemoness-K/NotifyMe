name: Deploy AI-DLC review site

on:
  push:
    branches:
      - ai-dlc-review-site
    paths:
      - docs/review-site/**
      - .github/workflows/deploy-review-site.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check out review site
        uses: actions/checkout@v7
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Build review site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs/review-site
          destination: ./_site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./_site
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
