name: Notify Me application checks

on:
  push:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'package*.json'
      - 'index.html'
      - '*config.ts'
      - 'tsconfig*.json'
      - 'deploy/u1/**'
      - 'deploy/u5/**'
      - '.github/workflows/u1-app-ci.yml'
  pull_request:
    paths:
      - 'src/**'
      - 'prisma/**'
      - 'tests/**'
      - 'package*.json'
      - 'index.html'
      - '*config.ts'
      - 'tsconfig*.json'
      - 'deploy/u1/**'
      - 'deploy/u5/**'
      - '.github/workflows/u1-app-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-u1:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: sudo apt-get update && sudo apt-get install -y caddy
      - run: npx playwright install --with-deps chromium
      - run: npm run verify:u1
